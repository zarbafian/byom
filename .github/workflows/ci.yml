name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 conformance/run.py

  family-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib-only independent rederiver; must fail on any mismatch or an
      # empty tree.
      - run: python3 family-vectors/xcheck.py

  family-vectors-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Dependency-free independent TypeScript-family rederiver (JSDoc-typed
      # .mjs); must fail on any mismatch or an empty tree.
      - run: node family-vectors/tscheck/check.mjs
